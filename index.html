<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diario — James "Doc" Cartwright</title>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Josefin+Slab:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --cream:#F2E8D0;
  --cream2:#E8DBC0;
  --ink:#1C120A;
  --ink2:#3D2B16;
  --ink3:#6B4C2A;
  --gold:#B8861C;
  --gold2:#D4A84B;
  --red:#8B2A1A;
  --brown:#5C3B1A;
  --shadow:rgba(20,10,4,.55);
  --paper:#F5EDD8;
  --paper2:#EDE3C8;
  --line:rgba(139,100,50,.18);
}

html{scroll-behavior:smooth}
body{
  background:#0f0a04;
  font-family:'Libre Baskerville',Georgia,serif;
  color:var(--ink);
  min-height:100vh;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}

/* ══════════════════════════════════════
   WESTERN BACKGROUND PATTERN
══════════════════════════════════════ */
#bg-canvas{
  position:fixed;inset:0;z-index:0;pointer-events:none;
}
.bg-pattern{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  opacity:0.055;
  background-image:
    repeating-linear-gradient(0deg,transparent,transparent 38px,rgba(180,140,60,.6) 38px,rgba(180,140,60,.6) 39px),
    repeating-linear-gradient(90deg,transparent,transparent 38px,rgba(180,140,60,.6) 38px,rgba(180,140,60,.6) 39px);
}

/* ══════════════════════════════════════
   TITLE SCREEN
══════════════════════════════════════ */
#title-screen{
  position:fixed;inset:0;z-index:500;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 45%, #2a1a06 0%, #0f0a04 70%);
  cursor:pointer;
  transition:opacity .8s ease;
}
#title-screen.fade-out{opacity:0;pointer-events:none}

.ts-top{
  font-family:'Josefin Slab',serif;
  font-size:10px;letter-spacing:6px;color:rgba(180,140,60,.5);
  text-transform:uppercase;margin-bottom:40px;
}
.ts-logo{
  width:clamp(80px,12vw,130px);height:auto;opacity:.9;margin-bottom:30px;
  filter:drop-shadow(0 0 20px rgba(180,130,40,.4));
}
.ts-name{
  font-family:'Cormorant Garamond',Georgia,serif;
  font-size:clamp(52px,8vw,110px);font-weight:400;
  color:#F2E0B0;line-height:1;letter-spacing:-1px;
  text-shadow:0 2px 40px rgba(180,130,40,.35);
  margin-bottom:8px;
}
.ts-alias{
  font-family:'Cormorant Garamond',Georgia,serif;
  font-size:clamp(20px,3vw,36px);font-style:italic;
  color:var(--gold2);margin-bottom:50px;
  text-shadow:0 0 30px rgba(180,130,40,.5);
}
.ts-rule{
  width:200px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(180,130,40,.5),transparent);
  margin-bottom:30px;
}
.ts-subtitle{
  font-family:'Josefin Slab',serif;
  font-size:11px;letter-spacing:4px;color:rgba(180,140,60,.45);
  text-transform:uppercase;margin-bottom:60px;
}
.ts-cta{
  font-family:'Josefin Slab',serif;
  font-size:11px;letter-spacing:5px;color:rgba(180,140,60,.35);
  text-transform:uppercase;
  animation:blink 2.2s ease-in-out infinite;
}
@keyframes blink{0%,100%{opacity:.3}50%{opacity:.8}}

/* ornament corners */
.corner{position:absolute;width:60px;height:60px;opacity:.35}
.corner svg{width:100%;height:100%}
.corner.tl{top:24px;left:24px}
.corner.tr{top:24px;right:24px;transform:scaleX(-1)}
.corner.bl{bottom:24px;left:24px;transform:scaleY(-1)}
.corner.br{bottom:24px;right:24px;transform:scale(-1)}

/* ══════════════════════════════════════
   MAIN WRAPPER
══════════════════════════════════════ */
#app{
  position:relative;z-index:1;
  min-height:100vh;
  display:flex;flex-direction:column;align-items:center;
  justify-content:flex-start;
  padding:0 0 60px;
}

/* ══════════════════════════════════════
   TOP BAR
══════════════════════════════════════ */
.top-bar{
  width:100%;display:flex;align-items:center;justify-content:center;gap:24px;
  padding:16px 32px;
  background:linear-gradient(to bottom,rgba(15,10,4,.97) 60%,transparent);
  position:sticky;top:0;z-index:100;
  backdrop-filter:blur(3px);
}
.top-bar-title{
  font-family:'Josefin Slab',serif;
  font-size:10px;letter-spacing:4px;text-transform:uppercase;
  color:rgba(180,140,60,.5);
}
.tb-btn{
  font-family:'Josefin Slab',serif;
  font-size:9px;letter-spacing:3px;text-transform:uppercase;
  color:rgba(180,140,60,.45);
  background:none;border:1px solid rgba(180,140,60,.2);
  padding:6px 14px;cursor:pointer;
  transition:all .2s;
}
.tb-btn:hover{color:var(--gold2);border-color:rgba(180,140,60,.5);background:rgba(180,140,60,.05)}
.tb-sep{width:1px;height:18px;background:rgba(180,140,60,.15)}

/* ══════════════════════════════════════
   SCENE & BOOK
══════════════════════════════════════ */
.scene-wrap{
  display:flex;align-items:center;justify-content:center;
  padding:40px 20px 20px;
  flex:1;
}
.scene{
  perspective:2400px;perspective-origin:50% 46%;
  --pg-h:min(86vh,760px);
  --pg-w:calc(var(--pg-h)/1.4142);
  width:calc(var(--pg-w)*2);
  height:var(--pg-h);
  position:relative;
  transition:transform .7s cubic-bezier(.4,0,.2,1);
}
.scene.closed-view{transform:translateX(calc(var(--pg-w) / -2))}

.book{
  width:100%;height:100%;
  position:relative;
  transform-style:preserve-3d;
  transition:transform .9s cubic-bezier(.4,0,.2,1);
  transform:rotateY(-5deg) rotateX(2deg);
}
.book.closed{transform:rotateY(-20deg) rotateX(6deg);cursor:pointer}

.page{
  position:absolute;width:50%;height:100%;right:0;
  transform-origin:left center;transform-style:preserve-3d;
  transition:transform .85s cubic-bezier(.4,0,.2,1);
  z-index:1;cursor:grab;
}
.page:active{cursor:grabbing}
.page.flipped{transform:rotateY(-180deg)}
.page.dragging{transition:none!important;z-index:50!important}

.page-front,.page-back{
  position:absolute;width:100%;height:100%;
  backface-visibility:hidden;overflow:visible;
}
#book img{-webkit-user-drag:none;user-drag:none;pointer-events:none}
#book *{user-select:none;-webkit-user-select:none}
.page-front{z-index:2;border-radius:0 3px 3px 0}
.page-back{transform:rotateY(180deg);z-index:1;border-radius:3px 0 0 3px}

.page[data-page="0"]{z-index:30}.page[data-page="1"]{z-index:29}
.page[data-page="2"]{z-index:28}.page[data-page="3"]{z-index:27}
.page[data-page="4"]{z-index:26}.page[data-page="5"]{z-index:25}
.page[data-page="6"]{z-index:24}.page[data-page="7"]{z-index:23}
.page[data-page="8"]{z-index:22}.page[data-page="9"]{z-index:21}
.page[data-page="10"]{z-index:20}.page[data-page="11"]{z-index:19}
.page[data-page="12"]{z-index:18}.page[data-page="13"]{z-index:17}
.page[data-page="14"]{z-index:16}.page[data-page="15"]{z-index:15}
.page[data-page="16"]{z-index:14}.page[data-page="17"]{z-index:13}
.page[data-page="18"]{z-index:12}.page[data-page="19"]{z-index:11}
.page[data-page="20"]{z-index:10}.page[data-page="21"]{z-index:9}
.page.flipped[data-page="0"]{z-index:9}.page.flipped[data-page="1"]{z-index:10}
.page.flipped[data-page="2"]{z-index:11}.page.flipped[data-page="3"]{z-index:12}
.page.flipped[data-page="4"]{z-index:13}.page.flipped[data-page="5"]{z-index:14}
.page.flipped[data-page="6"]{z-index:15}.page.flipped[data-page="7"]{z-index:16}
.page.flipped[data-page="8"]{z-index:17}.page.flipped[data-page="9"]{z-index:18}
.page.flipped[data-page="10"]{z-index:19}.page.flipped[data-page="11"]{z-index:20}
.page.flipped[data-page="12"]{z-index:21}.page.flipped[data-page="13"]{z-index:22}
.page.flipped[data-page="14"]{z-index:23}.page.flipped[data-page="15"]{z-index:24}
.page.flipped[data-page="16"]{z-index:25}.page.flipped[data-page="17"]{z-index:26}
.page.flipped[data-page="18"]{z-index:27}.page.flipped[data-page="19"]{z-index:28}
.page.flipped[data-page="20"]{z-index:29}.page.flipped[data-page="21"]{z-index:30}

/* ══ SPINE ══ */
.book-spine{
  position:absolute;left:50%;top:0;width:16px;height:100%;
  transform:translateX(-50%);z-index:40;pointer-events:none;
  background:linear-gradient(90deg,#2a1506,#4a2a0e,#2a1506);
  box-shadow:0 0 20px rgba(0,0,0,.6);
}

/* ══ COVER ══ */
.cover-face{
  border:none;
  background-color:#3D1C06;
  background-image:
    repeating-linear-gradient(45deg,transparent,transparent 2px,rgba(255,255,255,.015) 2px,rgba(255,255,255,.015) 4px),
    repeating-linear-gradient(-45deg,transparent,transparent 2px,rgba(0,0,0,.03) 2px,rgba(0,0,0,.03) 4px);
  box-shadow:inset 0 0 80px rgba(0,0,0,.3),8px 0 30px rgba(0,0,0,.6);
}
.cover-face::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(155deg,rgba(255,255,255,.07) 0%,transparent 45%,rgba(0,0,0,.15) 100%);
}
.cover-back{border-radius:3px 0 0 3px!important}

/* cover inner layout */
.cover-inner{
  position:relative;z-index:1;
  height:100%;display:flex;flex-direction:column;align-items:center;
  padding:28px 28px 24px;
}
.c-top{
  width:100%;display:flex;flex-direction:column;align-items:center;gap:8px;
  margin-bottom:10px;
}
.c-eyebrow{
  font-family:'Josefin Slab',serif;
  font-size:clamp(6px,.65vw,8px);letter-spacing:4px;text-transform:uppercase;
  color:rgba(220,185,100,.45);
}
.c-logo{
  width:clamp(44px,5.5vw,70px);height:auto;opacity:.88;
  filter:drop-shadow(0 0 10px rgba(180,130,40,.3));
}
.c-rule{
  width:55%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(200,160,80,.35),transparent);
}
.c-img-wrap{
  flex:1;display:flex;align-items:center;justify-content:center;
  width:100%;padding:8px 20px;overflow:hidden;
}
.c-img{
  max-width:100%;max-height:100%;
  object-fit:contain;
  filter:drop-shadow(0 4px 16px rgba(0,0,0,.5));
}
.c-text{
  width:100%;
  border-left:2px solid rgba(200,160,70,.3);
  padding-left:16px;
  margin-bottom:12px;
}
.c-lbl{
  font-family:'Josefin Slab',serif;
  font-size:clamp(6px,.6vw,8px);letter-spacing:3px;text-transform:uppercase;
  color:rgba(200,160,70,.45);
  margin-top:12px;margin-bottom:2px;
}
.c-lbl:first-child{margin-top:0}
.c-val{
  font-family:'Cormorant Garamond',Georgia,serif;
  font-size:clamp(16px,2.2vw,26px);color:rgba(242,224,176,.95);
  letter-spacing:.04em;line-height:1.2;
  text-shadow:0 2px 12px rgba(0,0,0,.6);
}
.c-val.sm{font-size:clamp(11px,1.4vw,16px)}
.c-bottom{
  width:100%;display:flex;flex-direction:column;align-items:center;gap:5px;
}
.c-badge{
  background:rgba(0,0,0,.35);
  border:1px solid rgba(200,160,70,.2);
  border-left:2px solid rgba(200,160,70,.45);
  padding:4px 14px;
  font-family:'Josefin Slab',serif;
  font-size:clamp(6px,.62vw,8px);letter-spacing:3px;
  color:rgba(200,160,70,.65);text-transform:uppercase;
  align-self:flex-start;white-space:nowrap;
}
.c-confid{
  font-family:'Josefin Slab',serif;
  font-size:clamp(5px,.5vw,7px);letter-spacing:2px;
  color:rgba(200,160,70,.2);text-transform:uppercase;text-align:center;
}

/* backcover */
.backcover-inner{
  position:relative;z-index:1;height:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;padding:40px 30px;
}
.bc-seal{
  width:clamp(60px,8vw,90px);height:auto;opacity:.35;
  filter:drop-shadow(0 0 8px rgba(180,130,40,.2));
}
.bc-text{
  font-family:'Josefin Slab',serif;
  font-size:clamp(7px,.7vw,9px);letter-spacing:4px;text-transform:uppercase;
  color:rgba(200,160,70,.3);text-align:center;line-height:2;
}

/* ══ PAPER PAGES ══ */
.paper-page{
  background:var(--paper);
  background-image:
    repeating-linear-gradient(0deg,transparent,transparent 27px,rgba(100,70,30,.09) 27px,rgba(100,70,30,.09) 28px);
  box-shadow:inset -2px 0 8px rgba(0,0,0,.12),3px 0 14px rgba(0,0,0,.22);
}
.paper-page-left{
  background:var(--paper);
  background-image:
    repeating-linear-gradient(0deg,transparent,transparent 27px,rgba(100,70,30,.09) 27px,rgba(100,70,30,.09) 28px);
  box-shadow:inset 2px 0 8px rgba(0,0,0,.1),-3px 0 12px rgba(0,0,0,.18);
}

/* ══ PAGE CONTENT ══ */
.pg-scroll{
  width:100%;height:100%;
  overflow-y:auto;padding:28px 26px 20px;
  position:relative;
}
.pg-scroll::-webkit-scrollbar{width:3px}
.pg-scroll::-webkit-scrollbar-thumb{background:rgba(100,70,30,.2)}

.pg-date{
  font-family:'Josefin Slab',serif;
  font-size:clamp(8px,.8vw,10px);letter-spacing:3px;text-transform:uppercase;
  color:var(--ink3);margin-bottom:6px;
  display:flex;align-items:center;gap:10px;
}
.pg-date::after{
  content:'';flex:1;height:1px;
  background:linear-gradient(90deg,rgba(100,70,30,.25),transparent);
}
.pg-title{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(15px,1.9vw,22px);font-weight:700;
  color:var(--ink);margin-bottom:4px;line-height:1.2;
}
.pg-title em{font-style:italic;color:var(--red)}
.pg-subtitle{
  font-family:'Josefin Slab',serif;
  font-size:clamp(7px,.7vw,9px);letter-spacing:2px;text-transform:uppercase;
  color:var(--ink3);margin-bottom:16px;
}
.pg-rule{
  width:100%;height:1px;margin-bottom:16px;
  background:linear-gradient(90deg,rgba(100,70,30,.35),rgba(100,70,30,.1),transparent);
}
.pg-body{
  font-family:'Libre Baskerville',Georgia,serif;
  font-size:clamp(12px,1.25vw,14.5px);
  line-height:1.85;color:var(--ink2);font-weight:400;
}
.pg-body p{margin-bottom:12px}
.pg-body p:last-child{margin-bottom:0}
.pg-body strong{color:var(--ink);font-weight:700}
.pg-body em{font-style:italic;color:var(--ink3)}

/* pull quote / nota */
.pg-nota{
  margin:14px 0;
  padding:10px 14px;
  border-left:2px solid rgba(139,42,26,.4);
  background:rgba(139,42,26,.04);
}
.pg-nota p{
  font-family:'Cormorant Garamond',serif;
  font-style:italic;font-size:clamp(11px,1.15vw,13px);
  color:var(--red);line-height:1.6;margin:0;
}

/* data table */
.data-table{
  width:100%;border-collapse:collapse;margin:12px 0;
}
.data-table td{
  font-family:'Libre Baskerville',Georgia,serif;
  font-size:clamp(10px,1.05vw,12.5px);
  padding:5px 0;
  border-bottom:1px solid rgba(100,70,30,.12);
  vertical-align:top;
}
.data-table td:first-child{
  font-family:'Josefin Slab',serif;
  font-size:clamp(7px,.7vw,9px);letter-spacing:2px;text-transform:uppercase;
  color:var(--ink3);width:38%;padding-right:12px;
}

/* timeline entry */
.tl-row{
  display:grid;grid-template-columns:80px 1fr;
  gap:10px 14px;padding:10px 0;
  border-bottom:1px solid rgba(100,70,30,.1);
  align-items:start;
}
.tl-row:last-child{border-bottom:none}
.tl-yr{
  font-family:'Josefin Slab',serif;
  font-size:clamp(8px,.8vw,10px);letter-spacing:1px;
  color:var(--red);padding-top:1px;line-height:1.4;
}
.tl-txt{
  font-family:'Libre Baskerville',Georgia,serif;
  font-size:clamp(11px,1.1vw,13px);line-height:1.7;
  color:var(--ink2);
}

/* stamp */
.pg-stamp{
  position:absolute;bottom:14px;right:18px;
  opacity:.12;transform:rotate(-8deg);
  font-family:'Josefin Slab',serif;
  font-size:clamp(9px,.9vw,11px);letter-spacing:3px;text-transform:uppercase;
  color:var(--red);border:2px solid var(--red);
  padding:4px 10px;pointer-events:none;
}

/* page number */
.pg-num{
  position:absolute;bottom:12px;left:50%;transform:translateX(-50%);
  font-family:'Josefin Slab',serif;
  font-size:9px;letter-spacing:2px;color:rgba(100,70,30,.35);
}

/* hint arrows */
.hint-line{
  font-family:'Josefin Slab',serif;
  font-size:9px;letter-spacing:2px;
  color:rgba(180,140,60,.25);text-align:center;
  margin-top:10px;
}

/* indicator */
.foot-indicator{
  font-family:'Josefin Slab',serif;
  font-size:9px;letter-spacing:3px;
  color:rgba(180,140,60,.35);min-width:80px;text-align:center;
}

/* ══ RESPONSIVE ══ */
@media(max-width:640px){
  .top-bar{gap:12px;padding:12px 16px}
  .scene-wrap{padding:24px 8px 16px}
  .pg-scroll{padding:18px 16px 14px}
}
</style>
</head>
<body>

<!-- BG -->
<canvas id="bg-canvas"></canvas>
<div class="bg-pattern"></div>

<!-- TITLE SCREEN -->
<div id="title-screen" onclick="enterApp()">
  <div class="corner tl"><svg viewBox="0 0 60 60" fill="none"><path d="M2 2 L2 20 M2 2 L20 2" stroke="#B8861C" stroke-width="2"/><circle cx="2" cy="2" r="3" fill="#B8861C" opacity=".6"/></svg></div>
  <div class="corner tr"><svg viewBox="0 0 60 60" fill="none"><path d="M2 2 L2 20 M2 2 L20 2" stroke="#B8861C" stroke-width="2"/><circle cx="2" cy="2" r="3" fill="#B8861C" opacity=".6"/></svg></div>
  <div class="corner bl"><svg viewBox="0 0 60 60" fill="none"><path d="M2 2 L2 20 M2 2 L20 2" stroke="#B8861C" stroke-width="2"/><circle cx="2" cy="2" r="3" fill="#B8861C" opacity=".6"/></svg></div>
  <div class="corner br"><svg viewBox="0 0 60 60" fill="none"><path d="M2 2 L2 20 M2 2 L20 2" stroke="#B8861C" stroke-width="2"/><circle cx="2" cy="2" r="3" fill="#B8861C" opacity=".6"/></svg></div>

  <div class="ts-top">Red Dead Redemption — Roleplay</div>
  <img src="image/logo.png" class="ts-logo" alt="" onerror="this.style.display='none'">
  <div class="ts-name">James Cartwright</div>
  <div class="ts-alias">"Doc"</div>
  <div class="ts-rule"></div>
  <div class="ts-subtitle">Diario Personale · 1863 – Presente</div>
  <div class="ts-cta">— clicca per aprire —</div>
</div>

<!-- APP -->
<div id="app" style="display:none">
  <!-- TOP BAR -->
  <div class="top-bar">
    <button class="tb-btn" onclick="prevPage()">← Indietro</button>
    <div class="tb-sep"></div>
    <span class="top-bar-title">Diario · James "Doc" Cartwright</span>
    <div class="tb-sep"></div>
    <span class="foot-indicator" id="page-indicator">—</span>
    <div class="tb-sep"></div>
    <button class="tb-btn" onclick="nextPage()">Avanti →</button>
  </div>

  <div class="scene-wrap">
    <div class="scene closed-view" id="book-scene">
      <div id="book" class="book closed">
        <div class="book-spine"></div>
      </div>
    </div>
  </div>
  <div class="hint-line" id="hint-line">clicca sulla copertina per aprire · trascina le pagine per sfogliare</div>
</div>

<script>
(function(){
'use strict';

/* ══════════ PAGES DATA ══════════ */
const PAGES = [
  // [front_content, back_content]
  // page[0] = cover / scheda anagrafica
  // page[1..N-1] = inner pages
  // page[last] = back cover

  // ── PAGE 1: Anagrafica (front) + Nota introduttiva (back)
  {
    front: `
    <div class="pg-scroll">
      <div class="pg-date">Dossier · Anagrafica</div>
      <div class="pg-title">Profilo <em>Identificativo</em></div>
      <div class="pg-rule"></div>
      <table class="data-table">
        <tr><td>Nome completo</td><td>James William Cartwright</td></tr>

  // ── PAGE 2: Profilo Psicologico

    front: `

        <p>James Cartwright è un uomo <strong>silenzioso, riflessivo e difficile da leggere</strong>. Cresciuto nel duro ambiente del Far West, ha imparato presto che la calma vale più di una pistola e che chi perde il controllo spesso perde anche la vita. È raro vederlo agitato: anche nelle situazioni peggiori mantiene sangue freddo e lucidità.</p>
        <p>Quel soprannome — <em>Doc</em> — non nasce dalla medicina. Nasce dal modo in cui affronta i problemi. Quando gli altri urlano, lui ragiona. Quando gli altri tremano, lui resta fermo. Tra lavoratori ferroviari, commercianti e uomini di frontiera, divenne famoso proprio per quella calma quasi innaturale.</p>
        <div class="pg-nota"><p>"Puoi urlare quanto vuoi. La situazione non cambia. Cambia solo quanto fiato ti rimane per affrontarla."</p></div>
        <p>James tende a non legarsi alle persone. Ha visto troppe famiglie distruggersi e troppi uomini perdere tutto. Non ama parlare del proprio passato e raramente racconta qualcosa della famiglia. <strong>Preferisce ascoltare piuttosto che parlare</strong>, osservare piuttosto che intervenire.</p>
      </div>
      <div class="pg-num">II</div>
    </div>`,
    back: `

        <p>È <strong>metodico, disciplinato e molto paziente</strong>. Gli anni sui treni gli hanno insegnato a leggere le persone: capisce quando qualcuno mente o quando sta per succedere qualcosa di brutto prima ancora che accada. Un bagaglio lasciato nel posto sbagliato, uno sguardo che dura troppo, un uomo che suda con il freddo fuori — James nota tutto.</p>

        <div class="pg-nota"><p>I suoi punti deboli: la diffidenza lo isola. Porta ancora il peso del cognome Cartwright come una pietra al collo.</p></div>

  // ── PAGE 3: Origini e famiglia
  {
    front: `
    <div class="pg-scroll">

      <div class="pg-rule"></div>
      <div class="pg-body">
        <p>I Cartwright arrivarono nel Dakota Territory nel <strong>1851</strong>, quando William Cartwright senior — il nonno di James — guidò la famiglia dal Missouri fino a Deadwood seguendo le prime piste commerciali verso ovest. Costruirono una fattoria di medie dimensioni a circa quattro miglia dalla città, allevando bestiame e coltivando mais.</p>
        <p><strong>William Cartwright Jr. — il padre di James</strong> — nacque nel 1838 e prese in mano la fattoria a diciassette anni dopo la morte del nonno. Era un uomo severo, capace e rispettato nella zona. Non era il tipo da mostrare affetto, ma nessuno metteva in dubbio la sua onestà o la sua parola.</p>
        <p>Sposò <strong>Eleanor Marsh</strong> nell'estate del <strong>1858</strong>, a soli vent'anni. Eleanor era figlia di un predicatore di Yankton e portò in casa una gentilezza quasi fuori posto in quelle terre. Aiutava malati e viaggiatori, leggeva la Bibbia ad alta voce e sapeva sempre trovare una parola buona anche nelle settimane più dure.</p>
        <div class="pg-nota"><p>James somiglia alla madre nella pazienza. Somiglia al padre nel silenzio.</p></div>
      </div>
      <div class="pg-num">IV</div>
    </div>`,
    back: `

        <p><strong>Clara Cartwright</strong> — nata nel <strong>1868</strong>, la più giovane — è la persona che James rispetta di più al mondo, anche se evita di ammetterlo. Quando la famiglia crollò, fu lei a tentare di salvare il salvabile. Vendette quasi tutto ciò che possedeva per pagare gli avvocati di Robert. Oggi lavora come sarta a Deadwood.</p>

  // ── PAGE 4: La madre Eleanor

        <p>La morte di William — avvenuta nell'inverno del <strong>1882</strong>, durante una tempesta di neve che lo sorprese mentre rientrava dalla città — distrusse qualcosa dentro Eleanor che non si rimise mai più insieme.</p>
        <p>Nei mesi successivi il crollo fu progressivo e inesorabile. Prima smise di andare in chiesa. Poi smise di uscire di casa. Le voci in città iniziarono a circolare rapidamente: la signora Cartwright stava perdendo la testa. I debiti si accumulavano. La fattoria iniziò a cedere pezzo per pezzo.</p>

        <p>Oggi Eleanor ha sessantadue anni. Vive nella vecchia fattoria ridotta a poco più di una baracca. Clara la tiene in vita. James non la vede dal <strong>1883</strong>. Ci pensa ogni notte.</p>

        <p>Il primo lavoro di James fu come <strong>pulitore di vagoni</strong> per la Chicago & Northwestern Railway, nell'autunno del <strong>1876</strong>. Guadagnava meno di un dollaro al giorno. Dormiva nei vagoni merci vuoti. Mangiava quello che trovava.</p>
        <p>In sei mesi imparò a caricare e catalogare merci. In un anno conosceva a memoria tutte le rotte della linea tra Deadwood e Chicago. A quindici anni era già uno dei più abili caricatori del deposito di Sioux Falls — non per la forza, ma per la precisione. Pesava ogni cassa, calcolava ogni spostamento, non perdeva mai un pezzo.</p>

      <div class="pg-num">VIII</div>
    </div>`,

        <p><strong>Settembre 1878 — Linea Sioux Falls–Denver:</strong><br>

        <p>Sette anni sui treni dell'ovest ti cambiano in un modo che non riesci a spiegare a chi è sempre rimasto fermo nello stesso posto. Non è solo la distanza percorsa. È quello che vedi lungo la strada.</p>
        <p><strong>Vidi nascere Black Hills nel 1876.</strong> Prima che arrivassero le prime famiglie ci passai io, con le casse di provviste e gli attrezzi. Poi arrivarono i cercatori. Poi i saloon. Poi i cimiteri. Sempre nello stesso ordine.</p>

        <p><strong>Incontrai Frank Delaney a Dodge City nel 1881.</strong> Mercante di pellami, contrabbandiere per diletto, uomo capace di vendere ghiaccio ai nativi del New Mexico. Il commerciante più brillante che James abbia mai conosciuto. Gli insegnò le rotte dell'import/export oltre confine, i trucchi delle dogane, i contatti giusti a Laredo e a El Paso. Morì in un duello sei mesi dopo. Spreco immondo.</p>

        <p>James arrivò a Deadwood nel <strong>febbraio del 1883</strong>. Trovò una casa che non riconosceva. La fattoria era silenziosa in un modo sbagliato. Eleanor non era la donna che ricordava. Thomas aveva gli occhi di qualcuno che aveva già perso e non lo sapeva ancora. Robert aveva diciotto anni e frequentava le persone sbagliate.</p>

      <div class="pg-body">
        <p>Nell'<strong>estate del 1883</strong>, con Robert già nei guai con la legge e Thomas sempre più inaffidabile, James capì che restare a Deadwood avrebbe significato essere trascinato verso il fondo insieme al resto della famiglia. Non era un calcolo freddo. Era paura, e la lucidità sufficiente a riconoscerla.</p>
        <p>La mattina della partenza, lasciò sul tavolo della cucina una busta con <strong>sessanta dollari</strong> — quasi tutto quello che aveva. Non scrisse nulla. Non sapeva cosa scrivere che non suonasse come una scusa.</p>
        <p>Disse addio solo a Clara. Era l'unica sveglia a quell'ora. Gli chiese se sarebbe tornato. James disse di non saperlo. Clara non pianse. Era già abituata alle perdite.</p>
        <div class="pg-nota"><p>"Non stai scappando da loro," disse Clara. "Stai scappando da quello che potresti diventare se rimani." Era la cosa più intelligente che James avesse mai sentito dire. E la più dolorosa.</p></div>
        <p>Salì sul primo convoglio verso est quella mattina. Non guardò fuori dal finestrino quando il treno lasciò Deadwood. Alcune cose è meglio non vederle allontanarsi.</p>
      </div>
      <div class="pg-num">XV</div>
    </div>`
  },

  // ── PAGE 9: Dopo il crollo - attività commerciali
  {
    front: `
    <div class="pg-scroll">
      <div class="pg-date">Carriera · 1883–Presente</div>
      <div class="pg-title">Import, Export, <em>Sopravvivenza</em></div>
      <div class="pg-rule"></div>
      <div class="pg-body">
        <p>Dopo aver lasciato Deadwood, James non tornò subito alle ferrovie. Passò i primi mesi a fare lavori occasionali: guardiano notturno in un deposito a Cheyenne, assistente in un magazzino di Laramie, intermediario per un commerciante di bestiame a Abilene che aveva bisogno di qualcuno capace di leggere i contratti senza farsi ingannare.</p>
        <p>Nel <strong>tardo 1883</strong> riprese a viaggiare sui treni, questa volta non come dipendente fisso ma come <strong>agente commerciale indipendente</strong>. Il modello era semplice: comprava merci a basso prezzo nelle città di produzione e le rivendeva a prezzo maggiorato nelle città di frontiera dove la scarsità faceva salire i prezzi.</p>
        <p>Le merci principali con cui lavorava:<br>
        — Minerali e metalli grezzi dalle miniere del Colorado<br>
        — Pellame e cuoio lavorato dal Texas<br>
        — Grano e farina in eccedenza dal Kansas<br>
        — Medicinali e attrezzi chirurgici (alto margine, bassa concorrenza)<br>
        — Occasionalmente: armi e munizioni per commercianti certificati</p>
        <div class="pg-nota"><p>I medicinali erano la merce più redditizia e meno discussa. Nessuno ti fa domande quando porti chinino in una città con la febbre gialla.</p></div>
      </div>
      <div class="pg-num">XVI</div>
    </div>`,
    back: `
    <div class="pg-scroll">
      <div class="pg-date">Carriera · Contatti</div>
      <div class="pg-title">Reti <em>Commerciali</em></div>
      <div class="pg-rule"></div>
      <div class="pg-body">
        <p>Nel corso degli anni James ha costruito una rete discreta ma solida di contatti commerciali attraverso il West. Non amici — James non usa quella parola facilmente — ma <strong>persone di cui si fida abbastanza</strong> da fare affari.</p>
        <table class="data-table">
          <tr><td>William "Bull" Harmon</td><td>Proprietario deposito, Kansas City. Affidabile per stoccaggio merci, nessuna domanda.</td></tr>
          <tr><td>Marguerite Leclerc</td><td>Commerciante di tessuti, New Orleans. Contatti con import da Messico e Cuba.</td></tr>
          <tr><td>Joel Anker</td><td>Agente doganale, El Paso. Conosce ogni buco nella dogana del confine.</td></tr>
          <tr><td>Silas Thorn</td><td>Macchinista, Missouri Pacific. Gli deve un favore del 1881. Non chiede quanto costa.</td></tr>
          <tr><td>Ruth Macready</td><td>Farmacista ambulante, Denver. Fonte principale per medicinali a prezzi di costo.</td></tr>
        </table>
        <div class="pg-nota"><p>James tiene questi nomi in testa, mai scritti. I nomi scritti possono essere trovati. I nomi in testa muoiono con te.</p></div>
        <p>La sua reputazione come intermediario si basa su un principio semplice che ha rispettato sempre: <strong>i carichi arrivano, i prezzi pattuiti non cambiano, la parola data non si rompe</strong>. In un West dove metà degli uomini mente per abitudine, è abbastanza per valere qualcosa.</p>

      <div class="pg-num">XVII</div>

  // ── PAGE 10: Obiettivi e presente
  {
    front: `
    <div class="pg-scroll">
      <div class="pg-date">Presente · Stato Attuale</div>
      <div class="pg-title">Dove Sono <em>Adesso</em></div>
      <div class="pg-rule"></div>
      <div class="pg-body">
        <p>James Cartwright ha trentadue anni e non ha un letto fisso da quando ne aveva tredici. Non è un lamento — è semplicemente un fatto. Ha imparato a dormire bene sui treni, a mangiare quello che trova, a non portare più di quanto riesce a trasportare da solo.</p>
        <p>Cerca una città. Non una qualunque. Una città <strong>abbastanza stabile</strong> da permettergli di aprire qualcosa di proprio — un ufficio commerciale, un deposito merci, forse un piccolo magazzino. Qualcosa con una porta che possa chiudere a chiave e un nome sopra scritto con la sua grafia.</p>
        <p>Non cerca fama. Non cerca vendetta. Non cerca di salvare nessuno. Vuole solo smettere di muoversi. Vuole <strong>una vita che sia sua</strong>, in una città dove nessuno conosca il cognome Cartwright abbastanza a lungo da avere un'opinione su di esso.</p>
        <div class="pg-nota"><p>Ha abbastanza denaro per ricominciare. Ha abbastanza esperienza per farcela. Gli manca solo il coraggio di fermarsi davvero.</p></div>
      </div>
      <div class="pg-num">XVIII</div>
    </div>`,
    back: `
    <div class="pg-scroll">
      <div class="pg-date">Obiettivi · Motivazioni</div>
      <div class="pg-title">Quello che <em>Voglio</em></div>
      <div class="pg-rule"></div>
      <div class="pg-body">
        <p>James ha scritto i propri obiettivi una volta sola, su un foglio che ha poi bruciato. Li ricorda a memoria.</p>
      </div>
      <div style="margin-top:4px">
        <div class="tl-row"><div class="tl-yr">01</div><div class="tl-txt">Costruirsi una nuova vita attraverso il commercio e il lavoro ferroviario. Niente armi, niente lati sbagliati della legge.</div></div>
        <div class="tl-row"><div class="tl-yr">02</div><div class="tl-txt">Gestire attività legate al trasporto merci e all'import/export in modo indipendente. Non lavorare per nessuno se possibile.</div></div>
        <div class="tl-row"><div class="tl-yr">03</div><div class="tl-txt">Guadagnarsi rispetto come uomo affidabile e lavoratore serio. Nient'altro di più, niente di meno.</div></div>
        <div class="tl-row"><div class="tl-yr">04</div><div class="tl-txt">Lasciarsi alle spalle il nome Cartwright. Non cancellarlo — semplicemente smettere di essere definito da esso.</div></div>
        <div class="tl-row"><div class="tl-yr">05</div><div class="tl-txt">Accumulare abbastanza denaro da smettere di vivere continuamente in viaggio. Avere qualcosa di fisso.</div></div>
        <div class="tl-row"><div class="tl-yr">06</div><div class="tl-txt">Evitare il mondo criminale. Ha visto dove porta. Non è una scelta morale — è una scelta pratica.</div></div>

/* ══════════════════════════════════════
   BOOK ENGINE
══════════════════════════════════════ */
let bookPages = [];
let isOpen = false;
let currentPageNum = 0;
let isDragging = false;
let dragPage = null;
let dragDirection = null;
let dragStartX = 0;
let pageWidthPx = 0;
let currentAngle = 0;

function buildBook(){
  const bookEl = document.getElementById('book');
  const spine = bookEl.querySelector('.book-spine');
  bookEl.innerHTML = '';
  bookEl.appendChild(spine);
  bookPages = [];

  const totalPages = PAGES.length + 2; // +1 cover page, +1 backcover page

  for(let i = 0; i < totalPages; i++){
    const pageEl = document.createElement('div');
    pageEl.className = 'page';
    pageEl.dataset.page = String(i);

    const front = document.createElement('div');
    front.className = 'page-front';
    const back = document.createElement('div');
    back.className = 'page-back';

    if(i === 0){
      // COVER
      front.classList.add('cover-face');
      front.innerHTML = buildCover();
      back.classList.add('cover-face', 'cover-back');
      back.innerHTML = buildInnerCover();
    } else if(i === totalPages - 1){
      // BACKCOVER
      front.classList.add('cover-face', 'cover-back');
      front.innerHTML = '';
      back.classList.add('cover-face', 'cover-back');
      back.innerHTML = buildBackCover();
    } else {
      const pData = PAGES[i - 1];
      front.classList.add('paper-page');
      back.classList.add('paper-page-left');
      front.innerHTML = pData.front || blankPage();
      back.innerHTML = pData.back || blankPage();
    }

    pageEl.appendChild(front);
    pageEl.appendChild(back);
    bookEl.appendChild(pageEl);
    bookPages.push(pageEl);
  }

  attachBookEvents();
}

function buildCover(){
  return `<div class="cover-inner">
    <div class="c-top">
      <div class="c-eyebrow">Red Dead Redemption — Roleplay</div>
      <img src="image/logo.png" class="c-logo" alt="" onerror="this.style.display='none'">
      <div class="c-rule"></div>
    </div>
    <div class="c-img-wrap">
      <img src="image/logo.png" class="c-img" alt="Doc Cartwright" onerror="this.style.opacity='0'">
    </div>
    <div class="c-text">
      <div class="c-lbl">Nome</div>
      <div class="c-val">James Cartwright</div>
      <div class="c-lbl">Soprannome</div>
      <div class="c-val">"Doc"</div>
      <div class="c-lbl">Professione</div>
      <div class="c-val sm">Capo Treno · Commerciante</div>
    </div>
    <div class="c-bottom">
      <div class="c-rule"></div>
      <div class="c-badge">Diario Personale · 1863 – Presente</div>
      <div class="c-confid">Documento personale · Non distribuire</div>
    </div>
  </div>`;
}

function buildInnerCover(){
  return `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:40px">
    <div style="text-align:center;opacity:.25">
      <div style="font-family:'Josefin Slab',serif;font-size:9px;letter-spacing:4px;text-transform:uppercase;color:#d4a84b;line-height:2.5">
        James William Cartwright<br>
        Deadwood, Dakota Territory<br>
        12 Settembre 1863<br>
        ——<br>
        Capo Treno · Commerciante Itinerante<br>
        Civile · Legale
      </div>
    </div>
  </div>`;
}

function buildBackCover(){
  return `<div class="backcover-inner">
    <img src="image/logo.png" class="bc-seal" alt="" onerror="this.style.display='none'">
    <div class="c-rule" style="width:120px"></div>
    <div class="bc-text">
      James "Doc" Cartwright<br>
      Red Dead Redemption — Roleplay<br>
      ——<br>
      Civile · Legale
    </div>
  </div>`;
}

function blankPage(){
  return `<div style="width:100%;height:100%;background:var(--paper)"></div>`;
}

function attachBookEvents(){
  const bookEl = document.getElementById('book');
  bookEl.onmousedown = onDragStart;
  bookEl.ontouchstart = onDragStart;

  let justOpened = false;
  let coverAnimating = false;
  bookEl.addEventListener('click', function(e){
    if(!isOpen && !isDragging && !coverAnimating){
      coverAnimating = true;
      openBook();
      justOpened = true;
      setTimeout(()=>{ justOpened = false; coverAnimating = false; }, 600);
      e.stopPropagation();
    }
  });
  bookEl.addEventListener('click', function(e){
    if(!isOpen || isDragging || justOpened || coverAnimating) return;
    const rect = bookEl.getBoundingClientRect();
    const cx = e.clientX - rect.left;
    const edge = 100;
    if(cx > rect.width - edge) nextPage();
    else if(cx < edge) prevPage();
  });
}

function openBook(){
  if(isOpen) return;
  isOpen = true;
  document.getElementById('book').classList.remove('closed');
  document.getElementById('book-scene').classList.remove('closed-view');
  bookPages[0].classList.add('flipped');
  currentPageNum = 1;
  updateIndicator();
  document.getElementById('hint-line').style.opacity = '0';
}

window.nextPage = function(){
  const total = bookPages.length;
  if(currentPageNum >= total) return;
  bookPages[currentPageNum].classList.add('flipped');
  bookPages[currentPageNum].style.transform = '';
  currentPageNum++;
  updateIndicator();
};

window.prevPage = function(){
  if(currentPageNum <= 0) return;
  currentPageNum--;
  bookPages[currentPageNum].classList.remove('flipped');
  bookPages[currentPageNum].style.transform = '';
  updateIndicator();
  if(currentPageNum === 0){
    setTimeout(()=>{
      isOpen = false;
      document.getElementById('book').classList.add('closed');
    }, 420);
  }
};

function updateIndicator(){
  const el = document.getElementById('page-indicator');
  if(!isOpen || currentPageNum === 0){ el.textContent = '—'; return; }
  el.textContent = currentPageNum + ' / ' + (bookPages.length - 1);
}

function onDragStart(e){
  if(!isOpen) return;
  const bookEl = document.getElementById('book');
  const rect = bookEl.getBoundingClientRect();
  const clientX = e.clientX || (e.touches && e.touches[0].clientX);
  const clickX = clientX - rect.left;
  const center = rect.width / 2;
  const total = bookPages.length;

  if(clickX > center && currentPageNum < total){
    dragDirection = 'next'; dragPage = bookPages[currentPageNum];
  } else if(clickX <= center && currentPageNum > 1){
    dragDirection = 'prev'; dragPage = bookPages[currentPageNum - 1];
  } else return;

  isDragging = true; dragStartX = clientX;
  pageWidthPx = rect.width / 2;
  currentAngle = (dragDirection === 'next') ? 0 : -180;
  dragPage.classList.add('dragging');
  dragPage.style.transition = 'none';
  if(e.cancelable) e.preventDefault();
}

function onDragMove(e){
  if(!isDragging || !dragPage) return;
  const clientX = e.clientX || (e.touches && e.touches[0].clientX);
  const dx = dragStartX - clientX;
  if(dragDirection === 'next'){
    currentAngle = Math.max(-180, Math.min(0, -(dx / pageWidthPx) * 180));
  } else {
    currentAngle = Math.min(0, Math.max(-180, -180 + ((-dx) / pageWidthPx) * 180));
  }
  dragPage.style.transform = 'rotateY(' + currentAngle + 'deg)';
  if(e.cancelable) e.preventDefault();
}

function onDragEnd(){
  if(!isDragging || !dragPage) return;
  isDragging = false;
  dragPage.classList.remove('dragging');
  dragPage.style.transition = '';
  dragPage.style.transform = '';
  if(dragDirection === 'next' && currentAngle < -70) nextPage();
  else if(dragDirection === 'prev' && currentAngle > -110) prevPage();
  dragPage = null; dragDirection = null;
}

document.addEventListener('mousemove', onDragMove);
document.addEventListener('mouseup', onDragEnd);
document.addEventListener('touchmove', e=>{ onDragMove(e); }, { passive: false });
document.addEventListener('touchend', onDragEnd);
document.addEventListener('dragstart', e=>{ if(e.target.closest('#book')) e.preventDefault(); });

document.addEventListener('keydown', e=>{
  if(e.key === 'ArrowRight'){
    if(!isOpen) openBook();
    else nextPage();
  }
  if(e.key === 'ArrowLeft') prevPage();
});

/* ══════════════════════════════════════
   TITLE SCREEN → APP
══════════════════════════════════════ */
window.enterApp = function(){
  const ts = document.getElementById('title-screen');
  ts.classList.add('fade-out');
  setTimeout(()=>{
    ts.style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    buildBook();
    updateIndicator();
  }, 800);
};

/* ══════════════════════════════════════
   ANIMATED WESTERN BACKGROUND
══════════════════════════════════════ */
(function(){
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  let W, H, stars, particles;

  function resize(){
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }

  function rnd(a, b){ return a + Math.random() * (b - a); }

  function initStars(){
    stars = Array.from({length: 100}, ()=>({
      x: Math.random() * W,
      y: Math.random() * H * 0.55,
      r: rnd(0.3, 1.3),
      a: rnd(0.2, 0.6),
      flicker: rnd(0.003, 0.015),
      phase: Math.random() * Math.PI * 2
    }));
  }

  function initParticles(){
    particles = Array.from({length: 40}, ()=>({
      x: Math.random() * W,
      y: Math.random() * H,
      vx: rnd(-0.06, 0.06),
      vy: rnd(-0.12, -0.03),
      r: rnd(0.5, 2),
      a: rnd(0.04, 0.16),
      life: Math.random()
    }));
  }

  let t = 0;
  function draw(){
    ctx.clearRect(0, 0, W, H);

    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#080502');
    sky.addColorStop(0.45, '#120a03');
    sky.addColorStop(1, '#1a1005');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);

    const glow = ctx.createRadialGradient(W * .5, H * .7, 0, W * .5, H * .7, W * .5);
    glow.addColorStop(0, 'rgba(160,90,20,.08)');
    glow.addColorStop(1, 'transparent');
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, W, H);

    t += 0.01;
    for(const s of stars){
      const alpha = s.a * (0.65 + 0.35 * Math.sin(t * s.flicker * 60 + s.phase));
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,240,195,${alpha})`;
      ctx.fill();
    }

    for(const p of particles){
      p.x += p.vx; p.y += p.vy; p.life += 0.003;
      if(p.life > 1){
        p.x = Math.random() * W; p.y = H + 5; p.life = 0;
        p.a = rnd(0.04, 0.16); p.vy = rnd(-0.12, -0.03); p.vx = rnd(-0.06, 0.06);
      }
      const fade = p.life < 0.1 ? p.life / 0.1 : p.life > 0.85 ? (1 - p.life) / 0.15 : 1;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(200,150,50,${p.a * fade})`;
      ctx.fill();
    }

    requestAnimationFrame(draw);
  }

  window.addEventListener('resize', ()=>{ resize(); initStars(); initParticles(); });
  resize(); initStars(); initParticles(); draw();
})();

})();
</script>
